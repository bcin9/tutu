<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

    <!-- iOS 加到主畫面後以全螢幕 App 開啟 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="秘密基地">

    <link rel="apple-touch-icon" href="images/IMG_4011-icon-1024.png">
    <link rel="icon" href="images/IMG_4011-icon-1024.png" sizes="1024x1024" type="image/png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FAF5EC">

    <title>我們的秘密基地</title>
    <link rel="stylesheet" href="css/app.css?v=3">
</head>
<body>

    <!-- ===================== 解鎖畫面 ===================== -->
    <section id="lockScreen" class="lock" hidden>
        <img class="art lock-art" src="images/art/lock-door.jpg" alt="">
        <h1 data-bind="baseName">我們的秘密基地</h1>
        <p class="lock-sub">這裡只屬於我們兩個</p>

        <!-- 第一步：選你是誰 -->
        <div id="whoStep" class="who-list"></div>

        <!-- 第二步：輸入密碼 -->
        <div id="pinStep" class="pin-step" hidden>
            <p class="pin-who">嗨 <b id="pinWhoName"></b>，輸入你的密碼</p>
            <div class="pin-dots" id="pinDots"></div>
            <p class="pin-msg" id="pinMsg"></p>
            <div class="keypad" id="keypad"></div>
        </div>
    </section>

    <!-- ===================== 主畫面 ===================== -->
    <div id="app" hidden>
        <main class="app-main">

            <!-- 首頁 -->
            <section class="view" data-view="home">
                <div class="topbar">
                    <div>
                        <p class="greet" id="greet">嗨</p>
                        <h1 class="title" data-bind="baseName">我們的秘密基地</h1>
                    </div>
                    <button class="chip-btn" id="switchUserBtn" type="button">換人登入</button>
                </div>

                <div class="hero">
                    <img class="art hero-art" src="images/art/hero-island.jpg" alt="兔兔守護的小屋">
                </div>
                <div class="days">
                    <div class="days-label">我們在一起的第</div>
                    <div class="days-num"><span id="daysNum">0</span> <small style="font-size:1rem">天</small></div>
                    <div class="days-since" id="daysSince"></div>
                </div>

                <button class="card secret-card" type="button" data-go="secret">
                    <div class="card-head">
                        <span class="tag pink">今日秘密</span>
                        <span class="card-meta" id="homeSecretStatus">今日秘密</span>
                    </div>
                    <p class="secret-q" id="homeSecretQ">點此查看今日秘密</p>
                </button>

                <div class="entry-grid">
                    <button class="entry" type="button" data-go="lists" data-list="todo">
                        <span class="entry-icon">💡</span>
                        <span class="entry-name">想一起做的事</span>
                        <span class="entry-desc">專屬願望清單</span>
                    </button>
                    <button class="entry" type="button" data-go="lists" data-list="places">
                        <span class="entry-icon">✈️</span>
                        <span class="entry-name">想一起去的地方</span>
                        <span class="entry-desc">國內外旅遊計畫</span>
                    </button>
                    <a class="entry wide" href="bunny.html">
                        <span class="entry-icon">🌈</span>
                        <span>
                            <span class="entry-name" style="display:block"><span data-bind="bunnyName">兔兔</span>的彩虹小房間</span>
                            <span class="entry-desc">照片、音樂和信箱都在這裡，想牠的時候就來坐坐</span>
                        </span>
                    </a>
                </div>
            </section>

            <!-- 交換秘密（第二階段） -->
            <section class="view" data-view="secret" hidden>
                <div class="topbar">
                    <div>
                        <p class="greet">每天一題，回答後才能看到對方的答案</p>
                        <h1 class="title">交換秘密</h1>
                    </div>
                </div>
                
                <div id="secretLoading" class="soon" hidden>
                    <img class="art" src="images/art/bunny-messenger.jpg" alt="">
                    <h2 style="font-size: 1.1rem; color: var(--ink-soft)">載入中...</h2>
                </div>

                <div id="secretContent" class="secret-container">
                    <div class="secret-header">
                        <div class="secret-date-row">
                            <span class="secret-date" id="secretDate"></span>
                            <span class="secret-badge" id="secretBadge">🌟 今日秘密</span>
                        </div>
                        <h2 class="secret-question" id="secretQ"></h2>
                    </div>
                    
                    <div class="answers-area">
                        <div id="myAnswerSection"></div>
                        <div id="partnerAnswerSection"></div>
                    </div>
                </div>

                <!-- 秘密時光回憶錄 -->
                <div class="history-section">
                    <div class="history-header">
                        <h3 class="history-title">📖 秘密時光回憶錄 <span class="history-count" id="historyCount"></span></h3>
                    </div>
                    <div id="secretHistoryWrap" class="history-wrap">
                        <div id="secretHistoryList" class="history-list"></div>
                    </div>
                </div>
            </section>

            <!-- 清單（第三階段）：盲盒抽卡與約會清單 -->
            <section class="view" data-view="lists" hidden>
                <div class="topbar">
                    <div>
                        <p class="greet">專屬情侶的心動抽卡機</p>
                        <h1 class="title">約會計畫</h1>
                    </div>
                </div>
                
                <div class="list-tabs">
                    <button class="list-tab active" data-list-type="gacha">🃏 心動抽卡</button>
                    <button class="list-tab" data-list-type="matches">📅 約會清單</button>
                </div>
                
                <div id="listLoading" class="soon" hidden>
                    <p style="color: var(--ink-soft); margin-top: 2rem;">載入中...</p>
                </div>

                <div id="listContent" class="list-container">
                    <!-- Gacha View -->
                    <div id="gachaView">
                        <div id="categorySelector">
                            <h2 style="font-size:1.1rem; margin-bottom:8px;">今天想翻哪一種牌子？</h2>
                            <p style="font-size:0.9rem; color:var(--ink-soft); margin-bottom:20px;">選一個類別，看看會抽出什麼任務</p>
                            <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                                <button class="btn secondary" data-cat="daily" style="padding:20px;">🛋️ 日常</button>
                                <button class="btn secondary" data-cat="travel" style="padding:20px;">✈️ 旅行</button>
                                <button class="btn secondary" data-cat="food" style="padding:20px;">🥩 美食</button>
                                <button class="btn secondary" data-cat="crazy" style="padding:20px;">🎢 瘋狂</button>
                            </div>
                        </div>

                        <div id="swipeArea" style="display:none; text-align:center;">
                            <div id="cardDeck" style="background:#FFF; border:1px solid var(--border); border-radius:16px; padding:40px 20px; box-shadow:var(--shadow); margin:20px 0; min-height:180px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; line-height:1.6; font-weight:bold; color:var(--ink);">
                                <!-- Card content -->
                            </div>
                            <div style="display:flex; justify-content:center; gap:20px;">
                                <button id="btnPass" class="btn secondary" style="flex:1;">❌ 先不要</button>
                                <button id="btnLike" class="btn primary" style="flex:1;">❤️ 想一起</button>
                            </div>
                        </div>

                        <div id="swipeDone" style="display:none; text-align:center; padding:40px 0;">
                            <h3 style="margin-bottom:8px;">今天的牌子翻完囉！</h3>
                            <p style="color:var(--ink-soft); font-size:0.9rem; margin-bottom:20px;">換個類別繼續抽，或是去約會清單看看</p>
                            <button class="btn secondary" id="btnResetGacha">再抽一次</button>
                        </div>
                    </div>

                    <!-- Matches View -->
                    <div id="matchesView" hidden>
                        <div id="matchesList" style="display:flex; flex-direction:column; gap:12px;"></div>
                        <div id="matchesEmpty" style="display:none; text-align:center; padding:40px 0; color:var(--ink-soft);">
                            還沒有配對成功的事情喔！<br>快去抽卡看看吧～
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- 兔兔信差 -->
        <button class="messenger" id="messenger" type="button" aria-label="兔兔信差">
            <img class="art" src="images/art/bunny-messenger.jpg" alt="">
            <span class="messenger-badge" id="messengerBadge" hidden></span>
        </button>
        <div class="bubble" id="bubble"></div>

        <!-- 底部分頁 -->
        <nav class="tabbar">
            <div class="tabbar-inner">
                <button class="tab" type="button" data-tab="home">
                    <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>
                    首頁
                </button>
                <button class="tab" type="button" data-tab="secret">
                    <svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>
                    交換秘密
                    <span class="tab-dot" id="secretTabDot" hidden></span>
                </button>
                <button class="tab" type="button" data-tab="lists">
                    <svg viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="17.5" r="1.2"/></svg>
                    清單
                </button>
                <a class="tab" href="bunny.html">
                    <svg viewBox="0 0 24 24"><path d="M9 10.5C8 7 7.5 3.5 9 3.5s2 3.5 2 7"/><path d="M15 10.5c1-3.5 1.5-7 0-7s-2 3.5-2 7"/><ellipse cx="12" cy="15" rx="6" ry="5.5"/><circle cx="10" cy="14.5" r=".6" fill="currentColor"/><circle cx="14" cy="14.5" r=".6" fill="currentColor"/></svg>
                    兔兔小屋
                </a>
            </div>
        </nav>
    </div>

    <script src="js/config.js?v=7"></script>
    <script src="js/api.js?v=7"></script>
    <script src="js/ideas.js?v=7"></script>
    <script src="js/app.js?v=7"></script>
    <script src="js/secret.js?v=7"></script>
    <script src="js/lists.js?v=7"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').then(reg => {
                reg.update().catch(() => {});
            }).catch(() => {});

            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });
        }
    </script>
</body>
</html>
